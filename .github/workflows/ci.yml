name: CI

# Un Pull Request no es válido si alguna comprobación obligatoria falla.
# Ver docs/testing/strategy.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparador manual desde la pestaña Actions. Hace falta más de lo que parece:
  # sin él, la única forma de reejecutar la CI tras un cambio que NO toca el
  # repositorio —arreglar la facturación, cambiar la visibilidad, restablecer un
  # servicio externo— es empujar un commit vacío, que ensucia el historial para
  # decir «vuelve a intentarlo».
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La versión de Go NO se fija aquí a propósito: los jobs la leen de
  # `services/game-server/go.mod` con `go-version-file`. Duplicarla en dos sitios
  # garantiza que un día diverjan —ya ocurrió: go.mod pedía 1.25.11 mientras aquí
  # decía 1.23, y la CI no habría compilado—.
  # La de pnpm tampoco: sale del campo `packageManager` de package.json, por el
  # mismo motivo. Cada versión de herramienta se declara UNA vez, en el sitio
  # donde el proyecto ya la necesitaba.
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Integridad documental: enlaces rotos, invariantes citados pero no
  # registrados, ADR inexistentes. Barato de comprobar y carísimo de
  # arreglar cuando se acumula.
  # ─────────────────────────────────────────────────────────────
  docs:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar integridad de docs/
        run: node scripts/check-docs.mjs

      # Los scripts de utilidad no tienen dependencias: corren con el runner de
      # tests integrado de Node, sin `pnpm install`. Por eso viven en este job y
      # no en el de protocolo.
      - name: Tests de los scripts
        run: node --test "scripts/*.test.mjs"

  # ─────────────────────────────────────────────────────────────
  # Protocolo: formato, tipos, tests y —lo más importante— que el
  # JSON Schema exportado no haya derivado de los esquemas Zod.
  # ─────────────────────────────────────────────────────────────
  protocol:
    name: Protocolo (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la lee del campo `packageManager` de package.json.
      # Declararla también aquí hace que la acción falle con «Multiple versions
      # of pnpm specified» en lugar de elegir una, y de paso fija 10.25.0 exacto
      # en vez de flotar sobre 10.x.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # `pnpm run typecheck` (script raíz), NO `pnpm -r run typecheck`. El script
      # raíz construye antes `packages/protocol`, y eso no es opcional: `apps/web`
      # importa sus TIPOS desde `dist/`, que en un checkout limpio no existe
      # todavía. En una máquina de desarrollo el fallo no se ve porque `dist/`
      # sobrevive de compilaciones anteriores — es exactamente la clase de error
      # que sólo aparece en un entorno limpio, y por la que existe este workflow.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests del protocolo
        run: pnpm run protocol:test

      - name: Verificar que el JSON Schema no ha derivado de Zod
        # Si esto falla, alguien cambió los esquemas Zod sin regenerar los
        # artefactos que consume el Game Server. El contrato se habría roto en
        # silencio; aquí se rompe en la CI, que es donde debe romperse.
        run: |
          pnpm run protocol:build
          pnpm run protocol:check
          if ! git diff --exit-code -- packages/protocol/schema services/game-server/internal/protocol/schema; then
            echo "::error::Los esquemas generados no están al día. Ejecuta 'pnpm run protocol:build' y versiona el resultado."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Game Server: formato, vet, build y tests unitarios (sin infraestructura).
  # ─────────────────────────────────────────────────────────────
  game-server:
    name: Game Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/game-server/go.mod
          cache-dependency-path: services/game-server/go.sum

      - name: Verificar formato
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin formatear (ejecuta 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy sin cambios
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      # Los ficheros con la etiqueta `integration` NO los mira `go vet ./...`:
      # quedan fuera de la compilación por defecto. Sin este paso, un cambio de
      # firma puede romperlos y no enterarse nadie hasta el job de integración,
      # que además necesita servicios y tarda mucho más en fallar. Ya pasó.
      - name: go vet (etiqueta integration)
        run: go vet -tags=integration ./...

      - name: Build
        run: go build ./...

      - name: Tests unitarios
        run: go test -race -count=1 ./...

      - name: Cobertura
        run: go test -count=1 -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1

  # ─────────────────────────────────────────────────────────────
  # Tests de integración contra PostgreSQL y Redis reales.
  # Se activan con EO_INTEGRATION=1 y la etiqueta de compilación `integration`.
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integración (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game-server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: empires
          POSTGRES_PASSWORD: empires_ci_password
          POSTGRES_DB: empires_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empires -d empires_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/game-server/go.mod
          cache-dependency-path: services/game-server/go.sum

      - name: Tests de integración
        env:
          EO_INTEGRATION: '1'
          EO_TEST_POSTGRES_URL: postgres://empires:empires_ci_password@localhost:5432/empires_test?sslmode=disable
          EO_TEST_REDIS_URL: redis://localhost:6379/1
        run: go test -race -count=1 -tags=integration ./...

  # ─────────────────────────────────────────────────────────────
  # Imagen de contenedor: que el artefacto desplegable se construya.
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Imagen del Game Server
    runs-on: ubuntu-latest
    needs: [game-server]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/game-server.Dockerfile
          push: false
          tags: empires-online/game-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
